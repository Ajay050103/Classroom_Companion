<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Classroom Companion Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        🎓 Classroom Companion Dashboard
    </h1>
	

    <div class="card shadow p-4">

        <h3 class="mb-4">
            Assignments
        </h3>

        <table class="table table-bordered">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Task</th>
                <th>Status</th>
                <th>Due Date</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="assignment : ${assignments}">

                <td th:text="${assignment.id}">
                </td>

                <td th:text="${assignment.student.name}">
                </td>

                <td th:text="${assignment.description}">
                </td>

                <td th:text="${assignment.status}">
                </td>

                <td th:text="${assignment.dueDate}">
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
